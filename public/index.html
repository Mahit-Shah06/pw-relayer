<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PW Relayer</title>
  <link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" type="module"></script>
</head>
<body>
  <main>
    <header><a class="brand" href="/admin/">PW<span> / </span>RELAYER</a></header>
    <section class="card" id="unlock-panel" aria-label="Verify owner access" hidden>
      <form id="unlock-form">
        <label for="owner-key">Owner key</label>
        <input id="owner-key" type="password" autocomplete="current-password" required>
        <button type="submit">Continue</button>
      </form>
    </section>
    <section class="card" id="account-panel" aria-label="PW account" hidden>
      <div class="card-heading"><span>PW account</span><button id="lock" class="text-button" type="button">Sign out</button></div>
      <button id="browser-open" type="button" class="secondary" hidden>Open PW browser</button>
      <div id="login-panel">
        <div class="method-switch" role="group" aria-label="Connection method">
          <button id="use-token" type="button" aria-pressed="true">Existing session</button>
          <button id="use-otp" type="button" aria-pressed="false">Phone &amp; OTP</button>
        </div>
        <div id="token-panel">
          <form id="token-form">
            <label for="pw-token">Authorization token</label>
            <input id="pw-token" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" maxlength="16000" required>
            <label for="pw-refresh-token">Refresh token <span class="hint">(optional)</span></label>
            <input id="pw-refresh-token" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" maxlength="16000">
            <label for="pw-device-id">Device ID <span class="hint">(optional)</span></label>
            <input id="pw-device-id" type="text" autocomplete="off" spellcheck="false" autocapitalize="none" maxlength="128">
            <button type="submit">Verify &amp; save session</button>
          </form>
        </div>
        <div id="otp-panel" hidden>
          <p id="otp-unavailable" class="note">Unavailable. Use Open PW browser or Existing session.</p>
          <form id="phone-form">
            <label for="phone">Mobile number</label>
            <div class="phone-field"><span>+91</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" pattern="[6-9][0-9]{9}" required></div>
            <div id="pw-captcha" class="captcha"></div>
            <button id="send-otp" type="submit">Send OTP</button>
          </form>
          <form id="otp-form" hidden>
            <label for="otp">OTP</label><p class="hint" id="otp-destination"></p>
            <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required>
            <button type="submit">Verify &amp; connect</button>
          </form>
        </div>
      </div>
      <div id="connected-panel" hidden>
        <dl class="session-status">
          <dt>Account</dt><dd id="account-detail"></dd>
          <dt>Expires</dt><dd id="session-expiry"></dd>
          <dt>Renewal</dt><dd id="renewal-status" role="status"></dd>
        </dl>
        <button id="renew-now" type="button" class="secondary" hidden>Test renewal now</button>
        <button id="replace-session" type="button" class="secondary">Update saved session</button>
        <button id="disconnect" type="button" class="text-button remove-session">Remove saved PW session</button>
      </div>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="browser-room" class="browser-room" aria-label="Remote PW browser" hidden>
      <div class="browser-toolbar"><strong>PW browser · www.pw.live</strong><button id="browser-close" type="button" class="secondary">Close browser</button></div>
      <p id="browser-state" role="status">Opening…</p>
      <div class="browser-viewport"><canvas id="browser-screen" width="1000" height="760" tabindex="0" aria-label="Interactive PW page. Click a field, then type."></canvas></div>
      <label for="browser-text">Text for selected PW field</label>
      <form id="browser-type" class="browser-input"><input id="browser-text" type="password" autocomplete="off" maxlength="256"><button type="submit">Type into PW</button><button id="browser-enter" type="button" class="secondary">Enter ↵</button></form>
      <button id="browser-save" type="button" disabled>Save session &amp; close</button>
    </section>
  </main>
</body>
</html>
