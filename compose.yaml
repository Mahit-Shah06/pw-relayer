services:
  relayer:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./sources.json:/app/sources.json:ro
      - relay-data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  relay-data:
